[workspace]
resolver = "2"
members = [
    "crates/dsh-pet-core",
    "crates/dsh-pet-ui",
    "crates/dsh-pet-app",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
authors = ["DSH Team"]
repository = "https://github.com/dsh-external/dsh-pet-rs"
homepage = "https://github.com/dsh-external/dsh-pet-rs"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
tokio-tungstenite = "0.23"
directories = "5"
rand = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
